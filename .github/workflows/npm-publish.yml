name: Publish npm packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: npm-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify tag matches release version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run build:npm-cli
      - run: bun run pack:npm:dry-run

      - name: Publish packages
        run: |
          set -euo pipefail

          for package_dir in \
            packages/npm/typefully-cli-darwin-arm64 \
            packages/npm/typefully-cli-darwin-x64 \
            packages/npm/typefully-cli-linux-arm64 \
            packages/npm/typefully-cli-linux-x64 \
            packages/npm/typefully-cli
          do
            package_name="$(node -p "require('./${package_dir}/package.json').name")"
            package_version="$(node -p "require('./${package_dir}/package.json').version")"

            if npm view "${package_name}@${package_version}" version --prefer-online >/dev/null 2>&1; then
              echo "Skipping ${package_name}@${package_version}; already published."
              continue
            fi

            echo "Publishing ${package_name}@${package_version} from ${package_dir}"
            npm publish "./${package_dir}" --access public
          done
